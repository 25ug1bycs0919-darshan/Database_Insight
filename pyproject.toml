[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightsql"
version = "1.0.0"
description = "Read-only natural-language SQLite analytics application"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68,<3",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["insightsql*"]
